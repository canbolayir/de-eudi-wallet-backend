name: RWSCA revocation resurrection PoC

on:
  push:
    branches:
      - poc/rwsca-revocation-resurrection
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Generate local PKI and SoftHSM fixtures
        shell: bash
        run: |
          chmod +x softhsm/*.sh
          ./softhsm/gen-keys.sh

      - name: Build backend jars
        shell: bash
        run: ./gradlew --no-daemon bootJar bootJarMdvm bootJarRwsca bootJarWpb bootJarPns

      - name: Start isolated local stack
        shell: bash
        run: |
          docker compose up --build --wait app-combined
          curl -fsS http://127.0.0.1:8080/actuator/health/readiness

      - name: Run full HTTP/HSM revocation-resurrection E2E PoC
        shell: bash
        env:
          POC_BASE_URL: http://127.0.0.1:8080
        run: |
          ./gradlew --no-daemon test --tests 'de.eudiwallet.backend.poc.RwscaRevocationResurrectionE2eTest'

      - name: Show backend logs on failure
        if: failure()
        shell: bash
        run: docker compose logs --no-color app-combined || true

      - name: Stop stack
        if: always()
        shell: bash
        run: docker compose down -v || true
